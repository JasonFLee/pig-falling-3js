<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jason Lee</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        #intro-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #welcome-text {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(32px, 8vw, 56px);
            color: white;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            padding: 0 20px;
        }

        #start-button {
            font-size: clamp(16px, 4vw, 22px);
            padding: 16px 40px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #start-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #start-button:disabled {
            opacity: 0.7;
        }

        #volume-hint {
            margin-top: 25px;
            font-size: clamp(12px, 3vw, 14px);
            color: rgba(255, 255, 255, 0.6);
        }

        #start-button.loading::after {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-left: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #story-overlay {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 720px;
            z-index: 100;
            pointer-events: none;
        }

        .story-segment {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            text-align: center;
        }

        .story-segment.active {
            opacity: 1;
        }

        .story-text {
            font-family: Georgia, serif;
            font-size: clamp(12px, 2.8vw, 17px);
            line-height: 1.55;
            color: white;
            text-shadow: 0 2px 15px rgba(0,0,0,0.95), 0 0 30px rgba(0,0,0,0.9);
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .story-media-container {
            text-align: center;
            margin: 10px auto;
        }

        .story-media {
            display: inline-block;
            margin: 4px;
            pointer-events: all;
            max-width: 110px;
        }

        .story-media img {
            width: 100%;
            max-height: 80px;
            object-fit: cover;
            border: 2px solid white;
            border-radius: 4px;
        }

        .story-media.wide {
            max-width: 90%;
            width: 440px;
        }

        .story-media.wide img {
            max-height: 320px;
            object-fit: contain;
        }

        .story-media iframe {
            width: 140px;
            height: 90px;
            border: 2px solid white;
            border-radius: 4px;
        }

        @media (max-width: 500px) {
            #welcome-text {
                font-size: 28px;
                margin-bottom: 30px;
            }
            #start-button {
                font-size: 16px;
                padding: 14px 32px;
            }
            #story-overlay {
                bottom: 25px;
            }
            .story-text {
                font-size: 11px;
                line-height: 1.45;
            }
            .story-media {
                max-width: 80px;
            }
            .story-media img {
                max-height: 60px;
            }
            .story-media iframe {
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div id="welcome-text">Jason Lee - Welcome to my website :)</div>
        <button id="start-button">Enter</button>
        <div id="volume-hint">🔊 Turn on volume for the best experience</div>
    </div>

    <div id="canvas-container"></div>
    <div id="story-overlay"></div>

    <audio id="background-music" loop preload="auto">
        <source src="/Arm [aPg_C-RRqx4].mp3" type="audio/mpeg">
    </audio>

    <audio id="narration-audio" preload="auto">
        <source src="/narration.m4a" type="audio/mp4">
    </audio>

    <script type="module" src="/main.js"></script>
    <script>
        // Keep screen awake on mobile while site is open
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    if (wakeLock) { try { wakeLock.release(); } catch(e) {} }
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch(e) {}
        }
        // Re-acquire when tab becomes visible again (lock releases when tab hides)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });
        // Re-acquire when page is restored from back-forward cache
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                requestWakeLock();
                // Resume narration if it was playing
                if (narration && narration.paused && !narration.ended && narration.currentTime > 0) {
                    narration.play().catch(() => {});
                }
                if (audio && audio.paused) {
                    audio.play().catch(() => {});
                }
            }
        });
        requestWakeLock();
    </script>
    <script>
        const audio = document.getElementById('background-music');
        const narration = document.getElementById('narration-audio');

        // Mobile detection for volume adjustment
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        audio.volume = isMobile ? 1.0 : 0.06; // Will be controlled by GainNode on mobile
        audio.muted = false;
        narration.volume = 1.0; // Full volume narration always

        // Route BOTH audio elements through a shared AudioContext on mobile
        // so iOS doesn't silence one when the other plays
        let sharedAudioCtx = null;
        function setupMobileAudio() {
            if (!isMobile) return;
            try {
                sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Music: quiet background
                const musicSource = sharedAudioCtx.createMediaElementSource(audio);
                const musicGain = sharedAudioCtx.createGain();
                musicGain.gain.value = 0.03; // quiet background music
                musicSource.connect(musicGain);
                musicGain.connect(sharedAudioCtx.destination);

                // Narration: clear but not blasting
                const narrationSource = sharedAudioCtx.createMediaElementSource(narration);
                const narrationGain = sharedAudioCtx.createGain();
                narrationGain.gain.value = 0.5; // half volume voice
                narrationSource.connect(narrationGain);
                narrationGain.connect(sharedAudioCtx.destination);

                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
            } catch(e) {
                console.log('Web Audio API setup failed:', e);
                audio.volume = 0.12;
                narration.volume = 1.0;
            }
        }

        // Preload audio as soon as page loads
        let audioReady = false;
        let narrationReady = false;

        audio.addEventListener('canplaythrough', () => { audioReady = true; });
        narration.addEventListener('canplaythrough', () => { narrationReady = true; });

        // Force load
        audio.load();
        narration.load();

        // Timestamps from Whisper ASR transcription of narration.m4a (exact second-level sync)
        const storySegments = [
            // 0.0s - magic trick
            { time: 0,     text: "Seventh grade. I stand frozen in front of my peers. I'm alone on stage in my underwear. Kids are pointing and laughing." },
            { time: 6.4,   text: "What am I doing here? Magic! Oh yes, I wanted to be a magician.",
              media: [{ type: 'image', src: '/photo 1.png' }, { type: 'video', src: 'https://www.youtube.com/embed/d0m1AUuOE1E' }] },
            { time: 11.8,  text: "This was a trick where I would predict the colors of a spectator's drawing by taking off my clothes and revealing I knew how they'd color it all along.",
              media: [{ type: 'image', src: '/magic-trick.png', wide: true }] },
            { time: 21.9,  text: "But as I tug off my pants, I take off both the covering pants and the predicted shorts, showing everyone my underwear." },

            // 27.2s - Minecraft girl
            { time: 27.2,  text: "Kids are laughing at me on stage. Oh no. Next experience." },
            { time: 30.5,  text: "Now I'm 15. I met a girl while playing Minecraft. We never talked in person, just hours in game." },
            { time: 34.5,  text: "And this might be the perfect opportunity. California Universal Studios." },
            { time: 40.0,  text: "She said we should meet at one point. I get there. I see her. And I walk away before she sees me." },

            // 45.4s - reflection / pre-college
            { time: 45.4,  text: "I didn't want the digital world to be anything but digital. This was real. Real people, real emotions, real regret." },
            { time: 52.2,  text: "A bit older now, I'm in a pre-college program. I was never good with girls, I thought, but it seems like they might like me if I'm funny." },
            { time: 59.5,  text: "I start to get obsessed with what else I can control. I start journaling, meditating, exercising, sleeping. Habits for the future." },
            { time: 69.5,  text: "Maybe someday I'll be different, but maybe recognizable." },

            // 75.6s - college / Carolina Reapers
            { time: 75.6,  text: "College now. I can be who I want. I can be popular. I can be athletic. Can I be taken?" },
            { time: 81.8,  text: "I ask a girl out with Carolina Reaper peppers. I eat three trying to impress her.",
              media: [{ type: 'image', src: '/photo 2.webp' }] },
            { time: 89.5,  text: "I vomit in front of her wide eyes. Can I be taken? Well, I ask her later if she wants to be my girlfriend and somehow she says yes." },

            // 95.5s - travels
            { time: 95.5,  text: "We leave the country to see the world. We go to France, we go to Korea." },
            { time: 102.0, text: "I get a pet octopus and keep it in a jar.",
              media: [{ type: 'image', src: '/photo 3.jpg' }] },
            { time: 104.5, text: "I go to Thailand and get an arrow shaved into my head.",
              media: [{ type: 'image', src: '/photo 4.png' }] },
            { time: 107.0, text: "I go to Nepal to become a monk and make a documentary.",
              media: [{ type: 'image', src: '/photo 5.jpg' }] },
            { time: 112.0, text: "And we break up." },

            // 114.3s - Japan / pigs
            { time: 114.3, text: "It breaks me a little bit more than I thought I could be broken." },
            { time: 119.1, text: "I fly to Japan and find refuge in ramen and pig cafes.",
              media: [{ type: 'image', src: '/photo 6.png' }] },
            { time: 124.5, text: "What if pigs can fly, but they have no reason to prove it and instead obey gravity?" },
            { time: 129.5, text: "If I chase the impossible, what am I trying to escape?" },

            // 131.7s - grad school / Harvard
            { time: 131.7, text: "Graduate school decisions. I went to Dartmouth during a tour where I slept in the library because I booked an Airbnb in Dartmouth, Canada. Turns out I'm now homeless." },
            { time: 141.6, text: "I get woken up by a security guard who asks if I'm a student. No, not yet, I say.",
              media: [{ type: 'image', src: '/photo 7.png' }] },
            { time: 145.5, text: "I get into Harvard for policy and Dartmouth for engineering. Which to choose? I might regret this forever, but something feels special about where AI was invented." },
            { time: 153.0, text: "Something feels special about engineering. For a little while, I experienced FOMO, but not for an event, but rather for a life I could have lived." },
            { time: 158.4, text: "Did I make the right decision? Can I regret a reality I don't know?" },

            // 162.6s - life keeps going
            { time: 162.6, text: "Life just keeps going. Friends do crazy things, friends get rich, famous, friends get married. People I know of all ages die." },
            { time: 170.1, text: "Each moment just goes by, and the same uncomfortable feeling you have when you graduate from elementary school is the same one you have when a friend gets married." },
            { time: 180.9, text: "Just, huh, guess that just happened." },
            { time: 183.5, text: "I'm really scared of that feeling many years from now when there isn't the next thing to look forward to." },

            // 193.5s - in the meantime
            { time: 193.5, text: "In the meantime, I desperately feel the moments, trying to push out any vulnerability I'd encounter by just sitting with the present." },
            { time: 199.1, text: "I don't feel any less exposed now than I did in front of my middle school peers in my underwear." },
            { time: 204.3, text: "I'm still standing bare, waiting for the laughter to pass so I can move on." },
            { time: 210.1, text: "I chase the next accolade so I can move on. I embark in the next adventure so I can move on." },
            { time: 214.6, text: "In seventh grade, I wanted so badly to exit the stage, but I couldn't then." },
            { time: 220.5, text: "And I still haven't now." }
        ];

        let lastShownIndex = -1;

        function showSegment(seg, dur) {
            const overlay = document.getElementById('story-overlay');
            let html = '<div class="story-segment active"><div class="story-text">' + seg.text + '</div>';
            if (seg.media) {
                html += '<div class="story-media-container">';
                seg.media.forEach(m => {
                    if (m.type === 'image') {
                        const cls = m.wide ? 'story-media wide' : 'story-media';
                        html += '<div class="' + cls + '"><img src="' + m.src + '" alt=""></div>';
                    } else {
                        html += '<div class="story-media"><iframe src="' + m.src + '" frameborder="0" allowfullscreen></iframe></div>';
                    }
                });
                html += '</div>';
            }
            html += '</div>';
            overlay.innerHTML = html;

            setTimeout(() => {
                const s = overlay.querySelector('.story-segment');
                if (s) s.classList.remove('active');
            }, Math.max(dur - 400, 300));
        }

        function triggerEndingSequence() {
            // Clear subtitle
            document.getElementById('story-overlay').innerHTML = '';

            // Build overlay
            const endDiv = document.createElement('div');
            endDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;';

            // Static canvas — 6s fade in
            const staticCanvas = document.createElement('canvas');
            staticCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;transition:opacity 6s linear;';
            staticCanvas.width = 320;
            staticCanvas.height = 180;
            endDiv.appendChild(staticCanvas);

            // Black overlay
            const blackDiv = document.createElement('div');
            blackDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:#000;opacity:0;transition:opacity 2.5s ease-in;';
            endDiv.appendChild(blackDiv);

            // Thank you text
            const thankDiv = document.createElement('div');
            thankDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 3s ease-in;';
            thankDiv.innerHTML = '<p style="color:white;font-family:Georgia,serif;font-size:1.5em;text-align:center;padding:2em;line-height:1.8;letter-spacing:0.03em;">Thank you for being a part of my story :)</p>';
            endDiv.appendChild(thankDiv);

            document.body.appendChild(endDiv);

            const ctx = staticCanvas.getContext('2d');
            let animFrame;
            function drawStatic() {
                const img = ctx.createImageData(staticCanvas.width, staticCanvas.height);
                for (let i = 0; i < img.data.length; i += 4) {
                    const v = Math.random() * 255 | 0;
                    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
                }
                ctx.putImageData(img, 0, 0);
                animFrame = requestAnimationFrame(drawStatic);
            }

            // Start drawing static — music keeps looping forever, no fade, no stop
            drawStatic();

            // Begin slow static fade-in (10s CSS transition)
            setTimeout(() => { staticCanvas.style.opacity = '1'; }, 100);

            // After 6s: stop static, fade to black over 2.5s
            setTimeout(() => {
                cancelAnimationFrame(animFrame);
                blackDiv.style.opacity = '1';

                // After black settles (2.5s), show thank you text
                setTimeout(() => {
                    thankDiv.style.opacity = '1';
                }, 2500);
            }, 6500);
        }

        function startStory() {
            // Restore saved narration time if user is returning to the page
            const savedNarrationTime = parseFloat(sessionStorage.getItem('nt') || '0');
            const savedScrollProgress = parseFloat(sessionStorage.getItem('sp') || '0');
            if (savedNarrationTime > 5) {
                narration.currentTime = savedNarrationTime;
                // Restore pig position in main.js
                setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('restoreProgress', { detail: { scrollProgress: savedScrollProgress } }));
                }, 200);
            }

            narration.play().catch(e => console.log('Narration:', e));

            // Save narration time periodically for resume
            setInterval(() => {
                if (!narration.paused && !narration.ended && narration.currentTime > 0) {
                    sessionStorage.setItem('nt', narration.currentTime.toFixed(2));
                }
            }, 1000);

            function sync() {
                const t = narration.currentTime;
                for (let i = storySegments.length - 1; i >= 0; i--) {
                    if (t >= storySegments[i].time) {
                        if (i !== lastShownIndex) {
                            lastShownIndex = i;
                            const next = storySegments[i + 1];
                            const dur = next ? (next.time - storySegments[i].time) * 1000 : 10000;
                            showSegment(storySegments[i], dur);
                        }
                        break;
                    }
                }
                if (!narration.ended) requestAnimationFrame(sync);
                else {
                    sessionStorage.removeItem('nt');
                    sessionStorage.removeItem('sp');
                    // Let it fly for 5 seconds, then trigger ending
                    setTimeout(triggerEndingSequence, 5000);
                }
            }
            sync();
        }

        document.getElementById('start-button').addEventListener('click', async function() {
            const btn = this;
            const intro = document.getElementById('intro-screen');
            const hint = document.getElementById('volume-hint');

            btn.textContent = 'Loading';
            btn.classList.add('loading');
            btn.disabled = true;
            if (hint) hint.style.display = 'none';

            // Set up Web Audio for mobile (must be inside user gesture for iOS)
            setupMobileAudio();

            // Re-request wake lock inside user gesture (more reliable on iOS Safari)
            requestWakeLock();

            // Start BOTH audio files immediately on user click (required for mobile)
            // This unlocks audio playback on iOS/Android
            try {
                await Promise.all([
                    audio.play(),
                    narration.play()
                ]);
            } catch(e) {
                console.log('Audio start:', e);
            }

            // Pause narration, reset to start - will play when story starts
            narration.pause();
            narration.currentTime = 0;

            // Wait for scene to signal it's ready, or timeout after 2s
            let sceneReady = false;
            const readyHandler = () => { sceneReady = true; };
            window.addEventListener('sceneReady', readyHandler);

            // Check if scene is already rendered
            const checkReady = () => {
                return new Promise(resolve => {
                    const check = () => {
                        if (sceneReady || document.querySelector('#canvas-container canvas')) {
                            resolve();
                        } else {
                            setTimeout(check, 50);
                        }
                    };
                    check();
                    // Max wait 2 seconds
                    setTimeout(resolve, 2000);
                });
            };

            await checkReady();

            // Now fade out and start
            intro.classList.add('fade-out');

            setTimeout(() => {
                intro.remove();
                window.dispatchEvent(new CustomEvent('journeyStart'));
                window.dispatchEvent(new CustomEvent('startDescent'));
                startStory();
            }, 500);
        });
    </script>
</body>
</html>
