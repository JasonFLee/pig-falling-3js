<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jason Lee</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        #intro-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #welcome-text {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(32px, 8vw, 56px);
            color: white;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            padding: 0 20px;
        }

        #start-button {
            font-size: clamp(16px, 4vw, 22px);
            padding: 16px 40px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #start-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #start-button:disabled {
            opacity: 0.7;
        }

        #volume-hint {
            margin-top: 25px;
            font-size: clamp(12px, 3vw, 14px);
            color: rgba(255, 255, 255, 0.6);
        }

        #start-button.loading::after {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-left: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #story-overlay {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 720px;
            z-index: 100;
            pointer-events: none;
        }

        .story-segment {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            text-align: center;
        }

        .story-segment.active {
            opacity: 1;
        }

        .story-text {
            font-family: Georgia, serif;
            font-size: clamp(12px, 2.8vw, 17px);
            line-height: 1.55;
            color: white;
            text-shadow: 0 2px 15px rgba(0,0,0,0.95), 0 0 30px rgba(0,0,0,0.9);
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .story-media-container {
            text-align: center;
            margin: 10px auto;
        }

        .story-media {
            display: inline-block;
            margin: 4px;
            pointer-events: all;
            max-width: 110px;
        }

        .story-media img {
            width: 100%;
            max-height: 80px;
            object-fit: cover;
            border: 2px solid white;
            border-radius: 4px;
        }

        .story-media.wide {
            max-width: 90%;
            width: 440px;
        }

        .story-media.wide img {
            max-height: 320px;
            object-fit: contain;
        }

        .story-media iframe {
            width: 140px;
            height: 90px;
            border: 2px solid white;
            border-radius: 4px;
        }

        @media (max-width: 500px) {
            #welcome-text {
                font-size: 28px;
                margin-bottom: 30px;
            }
            #start-button {
                font-size: 16px;
                padding: 14px 32px;
            }
            #story-overlay {
                bottom: 25px;
            }
            .story-text {
                font-size: 11px;
                line-height: 1.45;
            }
            .story-media {
                max-width: 80px;
            }
            .story-media img {
                max-height: 60px;
            }
            .story-media iframe {
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div id="welcome-text">Jason Lee - Welcome to my website :)</div>
        <button id="start-button">Enter</button>
        <div id="volume-hint">🔊 Turn on volume for the best experience</div>
    </div>

    <div id="canvas-container"></div>
    <div id="story-overlay"></div>

    <audio id="background-music" loop preload="auto">
        <source src="/Arm [aPg_C-RRqx4].mp3" type="audio/mpeg">
    </audio>

    <audio id="narration-audio" preload="auto">
        <source src="/yay.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="/main.js"></script>
    <script>
        // Keep screen awake on mobile while site is open
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    if (wakeLock) { try { wakeLock.release(); } catch(e) {} }
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch(e) {}
        }
        // Re-acquire when tab becomes visible again (lock releases when tab hides)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });
        // Re-acquire when page is restored from back-forward cache
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                requestWakeLock();
                // Resume narration if it was playing
                if (narration && narration.paused && !narration.ended && narration.currentTime > 0) {
                    narration.play().catch(() => {});
                }
                if (audio && audio.paused) {
                    audio.play().catch(() => {});
                }
            }
        });
        requestWakeLock();
    </script>
    <script>
        const audio = document.getElementById('background-music');
        const narration = document.getElementById('narration-audio');

        // Mobile detection for volume adjustment
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        audio.volume = isMobile ? 1.0 : 0.12; // Will be controlled by GainNode on mobile
        audio.muted = false;
        narration.volume = 1.0; // Full volume narration always

        // Route BOTH audio elements through a shared AudioContext on mobile
        // so iOS doesn't silence one when the other plays
        let sharedAudioCtx = null;
        function setupMobileAudio() {
            if (!isMobile) return;
            try {
                sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Music: quiet background
                const musicSource = sharedAudioCtx.createMediaElementSource(audio);
                const musicGain = sharedAudioCtx.createGain();
                musicGain.gain.value = 0.06; // quiet background music
                musicSource.connect(musicGain);
                musicGain.connect(sharedAudioCtx.destination);

                // Narration: clear but not blasting
                const narrationSource = sharedAudioCtx.createMediaElementSource(narration);
                const narrationGain = sharedAudioCtx.createGain();
                narrationGain.gain.value = 0.5; // half volume voice
                narrationSource.connect(narrationGain);
                narrationGain.connect(sharedAudioCtx.destination);

                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
            } catch(e) {
                console.log('Web Audio API setup failed:', e);
                audio.volume = 0.12;
                narration.volume = 1.0;
            }
        }

        // Preload audio as soon as page loads
        let audioReady = false;
        let narrationReady = false;

        audio.addEventListener('canplaythrough', () => { audioReady = true; });
        narration.addEventListener('canplaythrough', () => { narrationReady = true; });

        // Force load
        audio.load();
        narration.load();

        // EXACT timestamps from Whisper JSON transcription - CORRECTED
        const storySegments = [
            // 0.0 - 7.36
            { time: 0.0, text: "7th grade. I stand frozen in front of my peers. I'm alone on stage in my underwear. Kids are pointing and laughing." },
            // 7.36 - 12.76
            { time: 7.36, text: "What am I doing here? Magic. Oh yes, I wanted to be a magician.", media: [{ type: 'image', src: '/photo 1.png' }, { type: 'video', src: 'https://www.youtube.com/embed/d0m1AUuOE1E' }] },
            // 12.76 - 21.72
            { time: 12.76, text: "This was a trick where I would predict the color of a spectator's drawing by taking off my clothes and revealing I knew their color all along by the clothes underneath.", media: [{ type: 'image', src: '/magic-trick.png', wide: true }] },
            // 21.72 - 26.68
            { time: 21.72, text: "But as I take off my pants, I take off both covering pants and the predicted shorts, showing everyone my underwear.", media: [{ type: 'image', src: '/magic-trick.png', wide: true }] },
            // 26.68 - 32.84
            { time: 26.68, text: "Kids are laughing at me on stage. Oh no, next experience." },
            // 32.84 - 38.28
            { time: 32.84, text: "Now I'm 15. I wanted to be the best Minecraft Skywars player online, and I met a girl while doing it." },
            // 38.28 - 44.52
            { time: 38.28, text: "We never talk in person, just hours in game. And this might be the perfect opportunity." },
            // 44.52 - 55.44
            { time: 44.52, text: "California, Universal Studios. She said we should meet at one point and I get there and see her and walk away before she sees me." },
            // 55.44 - 62.72
            { time: 55.44, text: "I didn't want the digital world to be anything but digital. This was real. Real people, real emotions, real regret. I must keep going." },
            // 62.72 - 72.88
            { time: 62.72, text: "A bit older now. I'm in a pre-college program. I was never good with girls I thought, but maybe they could like me if I'm funny. I start to get obsessed with what else I can control." },
            // 72.88 - 83.28
            { time: 72.88, text: "I drag a couch up a mountain with a friend. I'm trying to enjoy what I have left until I become a full adult. I don't think my friends understand how much I love many of them." },
            // 83.36 - 89.12 (College - Carolina Reapers - photo 2 here)
            { time: 83.36, text: "College now. I can be who I want. I can be popular. I can be athletic. Maybe I can be taken. I ask a girl out with Carolina Reapers.", media: [{ type: 'image', src: '/photo 2.webp' }] },
            // 89.12 - 94.56 (I eat three and vomit)
            { time: 89.12, text: "I eat three trying to impress her and then I vomit in front of her wide eyes." },
            // 94.56 - 101.52 (Dating, France, Korea)
            { time: 94.56, text: "Can I be taken? Well, I ask her later if she wants to date. Somehow she said yes. We go to France. We go to Korea." },
            // 101.52 - 106.64 (Octopus - photo 3 HERE)
            { time: 101.52, text: "I get a pet octopus and keep it in a jar.", media: [{ type: 'image', src: '/photo 3.jpg' }] },
            // 106.64 - 111.92 (Thailand - photo 4)
            { time: 106.64, text: "I go to Thailand and get an arrow shaved into my head.", media: [{ type: 'image', src: '/photo 4.png' }] },
            // 111.92 - 112.16 (Nepal - photo 5) - This is said at end of segment 19
            { time: 109.5, text: "I go to Nepal to become a monk and make a documentary.", media: [{ type: 'image', src: '/photo 5.jpg' }] },
            // 112.16 - 116.88 (Vietnam)
            { time: 112.16, text: "I go to Vietnam, point out a goat at a mountainside and say, that I want to eat that at a restaurant." },
            // 117.6 - 124.0 (Break up)
            { time: 117.6, text: "I come back. We break up. It breaks me a bit more than I thought I could be broken." },
            // 124.0 - 129.44 (Japan pig cafes - photo 6)
            { time: 124.0, text: "I don't really know what to do next other than to keep running. I fly to Japan and find refuge in ramen and pig cafes.", media: [{ type: 'image', src: '/photo 6.png' }] },
            // 129.44 - 135.36 (Cuddle)
            { time: 129.44, text: "Although clearly intelligent, all they wanted to do was cuddle." },
            // 135.36 - 140.56 (Pigs fly)
            { time: 135.36, text: "What if pigs can fly but they have no reason to prove it and instead obey gravity?" },
            // 140.56 - 146.0 (Chase impossible)
            { time: 140.56, text: "If I chase the impossible, what am I trying to prove? What am I trying to escape?" },
            // 146.0 - 156.48 (Dartmouth Canada - combined for longer display)
            { time: 146.0, text: "Graduate school decisions. I went to Dartmouth during a tour where I slept in the library because I booked the Airbnb in Dartmouth, Canada (the city). Turns out I'm now homeless." },
            // 156.48 - 163.12 (Security guard)
            { time: 156.48, text: "I get woken up by a security guard who asks if I'm a student. I say no, not yet." },
            // 163.12 - 173.04 (Harvard/Dartmouth - photo 7)
            { time: 163.12, text: "I get into Harvard for Policy and Dartmouth for Engineering. Which to choose? I might regret this forever but something feels special about going where AI was invented. Something feels special about engineering.", media: [{ type: 'image', src: '/photo 7.png' }] },
            // 173.04 - 179 (FOMO)
            { time: 173.04, text: "For a little while I experienced FOMO but not for an event but rather a life I could have lived." },
            // 179 - 182.32 (Regret reality)
            { time: 179.12, text: "Did I make the right decision? Can I regret a reality I don't know?" },
            // 182.32 - 194 (Regret unknown + long journey)
            { time: 182.32, text: "Regret of the unknown is tricky and upon graduating, I figure there's a long journey ahead and I don't want to carry anything extra along the way." },
            // 193 - 201 (Life keeps going — speech resumes at 193.36s after 1.55s pause)
            { time: 193, text: "Life just keeps going. Friends do crazy things, friends get rich, famous, some get married, people I know of all ages die." },
            // 201 - 208 (Elementary school feeling — speech at 201.38s)
            { time: 201, text: "Each moment just goes by and the same uncomfortable feeling you have when you graduate elementary school is the same one you have when a friend gets married." },
            // 208 - 212 (Just huh — said ~208-211s, before the notable 1.02s pause)
            { time: 208, text: "Just, huh, guess that just happened." },
            // 212 - 218 (Scared — speech at 212.36s, after the 1.02s pause)
            { time: 212, text: "I'm really scared of that feeling many years from now when there isn't a next thing to look forward to." },
            // 218 - 228 (Truth/exposed/bare — speech at 217.99s, 10s display window)
            { time: 218, text: "The truth is I don't feel any less exposed now than I did in front of middle school peers in my underwear. I'm still standing bare waiting for the laughter to pass so I can move on." },
            // 228 - 237 (Chase/embark/avoid — speech ~228s, 9s display window)
            { time: 228, text: "I chase the next accolade so I can move on. I embark on the next adventure so I can move on. I do anything to avoid the vulnerable feeling of facing the present." },
            // 237 - 248 (But if then... "and the rush of fear" at 4:05=245s — speech at 237.43s)
            { time: 237, text: "But if then, for only a second, I open my awareness to the full intensity of the moment, the screams, the laughter, the sting of embarrassment and the rush of fear, I think I would find something surprising." },
            // 248 - 255 (That something so traumatic — 4:08=248s)
            { time: 248, text: "That something so traumatic was actually an invitation to fully experience the intensity of the present moment." },
            // 255 - 259 (Nothing to run from — 4:15=255s)
            { time: 255, text: "There, there was nothing to run from and there still isn't." },
            // 259 - end (A life with love — 4:19=259s; "there's so much to experience still" at 4:26=266s)
            { time: 259, text: "A life with love and laughter and adventures isn't enough. I must be present for the full capacity of experience and there's so much to experience still." }
        ];

        let lastShownIndex = -1;

        function showSegment(seg, dur) {
            const overlay = document.getElementById('story-overlay');
            let html = '<div class="story-segment active"><div class="story-text">' + seg.text + '</div>';
            if (seg.media) {
                html += '<div class="story-media-container">';
                seg.media.forEach(m => {
                    if (m.type === 'image') {
                        const cls = m.wide ? 'story-media wide' : 'story-media';
                        html += '<div class="' + cls + '"><img src="' + m.src + '" alt=""></div>';
                    } else {
                        html += '<div class="story-media"><iframe src="' + m.src + '" frameborder="0" allowfullscreen></iframe></div>';
                    }
                });
                html += '</div>';
            }
            html += '</div>';
            overlay.innerHTML = html;

            setTimeout(() => {
                const s = overlay.querySelector('.story-segment');
                if (s) s.classList.remove('active');
            }, Math.max(dur - 400, 300));
        }

        function triggerEndingSequence() {
            // Clear subtitle
            document.getElementById('story-overlay').innerHTML = '';

            // Build overlay
            const endDiv = document.createElement('div');
            endDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;';

            // Static canvas — 6s fade in
            const staticCanvas = document.createElement('canvas');
            staticCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;transition:opacity 6s linear;';
            staticCanvas.width = 320;
            staticCanvas.height = 180;
            endDiv.appendChild(staticCanvas);

            // Black overlay
            const blackDiv = document.createElement('div');
            blackDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:#000;opacity:0;transition:opacity 2.5s ease-in;';
            endDiv.appendChild(blackDiv);

            // Thank you text
            const thankDiv = document.createElement('div');
            thankDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 3s ease-in;';
            thankDiv.innerHTML = '<p style="color:white;font-family:Georgia,serif;font-size:1.5em;text-align:center;padding:2em;line-height:1.8;letter-spacing:0.03em;">Thank you for being a part of my story :)</p>';
            endDiv.appendChild(thankDiv);

            document.body.appendChild(endDiv);

            const ctx = staticCanvas.getContext('2d');
            let animFrame;
            function drawStatic() {
                const img = ctx.createImageData(staticCanvas.width, staticCanvas.height);
                for (let i = 0; i < img.data.length; i += 4) {
                    const v = Math.random() * 255 | 0;
                    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
                }
                ctx.putImageData(img, 0, 0);
                animFrame = requestAnimationFrame(drawStatic);
            }

            // Start drawing static — music keeps looping forever, no fade, no stop
            drawStatic();

            // Begin slow static fade-in (10s CSS transition)
            setTimeout(() => { staticCanvas.style.opacity = '1'; }, 100);

            // After 6s: stop static, fade to black over 2.5s
            setTimeout(() => {
                cancelAnimationFrame(animFrame);
                blackDiv.style.opacity = '1';

                // After black settles (2.5s), show thank you text
                setTimeout(() => {
                    thankDiv.style.opacity = '1';
                }, 2500);
            }, 6500);
        }

        function startStory() {
            // Restore saved narration time if user is returning to the page
            const savedNarrationTime = parseFloat(sessionStorage.getItem('nt') || '0');
            const savedScrollProgress = parseFloat(sessionStorage.getItem('sp') || '0');
            if (savedNarrationTime > 5) {
                narration.currentTime = savedNarrationTime;
                // Restore pig position in main.js
                setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('restoreProgress', { detail: { scrollProgress: savedScrollProgress } }));
                }, 200);
            }

            narration.play().catch(e => console.log('Narration:', e));

            // Save narration time periodically for resume
            setInterval(() => {
                if (!narration.paused && !narration.ended && narration.currentTime > 0) {
                    sessionStorage.setItem('nt', narration.currentTime.toFixed(2));
                }
            }, 1000);

            function sync() {
                const t = narration.currentTime;
                for (let i = storySegments.length - 1; i >= 0; i--) {
                    if (t >= storySegments[i].time) {
                        if (i !== lastShownIndex) {
                            lastShownIndex = i;
                            const next = storySegments[i + 1];
                            const dur = next ? (next.time - storySegments[i].time) * 1000 : 10000;
                            showSegment(storySegments[i], dur);
                        }
                        break;
                    }
                }
                if (!narration.ended) requestAnimationFrame(sync);
                else {
                    sessionStorage.removeItem('nt');
                    sessionStorage.removeItem('sp');
                    // Let it fly for 5 seconds, then trigger ending
                    setTimeout(triggerEndingSequence, 5000);
                }
            }
            sync();
        }

        document.getElementById('start-button').addEventListener('click', async function() {
            const btn = this;
            const intro = document.getElementById('intro-screen');
            const hint = document.getElementById('volume-hint');

            btn.textContent = 'Loading';
            btn.classList.add('loading');
            btn.disabled = true;
            if (hint) hint.style.display = 'none';

            // Set up Web Audio for mobile (must be inside user gesture for iOS)
            setupMobileAudio();

            // Re-request wake lock inside user gesture (more reliable on iOS Safari)
            requestWakeLock();

            // Start BOTH audio files immediately on user click (required for mobile)
            // This unlocks audio playback on iOS/Android
            try {
                await Promise.all([
                    audio.play(),
                    narration.play()
                ]);
            } catch(e) {
                console.log('Audio start:', e);
            }

            // Pause narration, reset to start - will play when story starts
            narration.pause();
            narration.currentTime = 0;

            // Wait for scene to signal it's ready, or timeout after 2s
            let sceneReady = false;
            const readyHandler = () => { sceneReady = true; };
            window.addEventListener('sceneReady', readyHandler);

            // Check if scene is already rendered
            const checkReady = () => {
                return new Promise(resolve => {
                    const check = () => {
                        if (sceneReady || document.querySelector('#canvas-container canvas')) {
                            resolve();
                        } else {
                            setTimeout(check, 50);
                        }
                    };
                    check();
                    // Max wait 2 seconds
                    setTimeout(resolve, 2000);
                });
            };

            await checkReady();

            // Now fade out and start
            intro.classList.add('fade-out');

            setTimeout(() => {
                intro.remove();
                window.dispatchEvent(new CustomEvent('journeyStart'));
                window.dispatchEvent(new CustomEvent('startDescent'));
                startStory();
            }, 500);
        });
    </script>
</body>
</html>
