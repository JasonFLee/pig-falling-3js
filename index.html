<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason's Interactive Portfolio - A Pig's Journey</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #intro-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #intro-text {
            font-family: 'Dancing Script', cursive;
            font-size: 56px;
            color: white;
            text-align: center;
            opacity: 0;
            animation: softFadeIn 2s ease-in-out forwards;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(74, 144, 226, 0.3),
                0 0 60px rgba(74, 144, 226, 0.2);
            letter-spacing: 2px;
        }

        @keyframes softFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        #click-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 100;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        #click-indicator.show {
            animation: pulse 2s infinite;
            opacity: 1;
        }

        .click-arrow {
            font-size: 48px;
            display: block;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #info-overlay {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 18px;
            z-index: 50;
            max-width: 300px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .info-item {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(0);
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px) scale(1.02);
            box-shadow:
                0 12px 48px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        #buttons-overlay {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
        }

        .link-button {
            display: block;
            margin: 15px 0;
            padding: 16px 32px;
            background: rgba(74, 144, 226, 0.3);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 8px 32px rgba(74, 144, 226, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .link-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .link-button:hover {
            background: rgba(74, 144, 226, 0.5);
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 12px 48px rgba(74, 144, 226, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .link-button:active {
            transform: translateY(-1px) scale(1.02);
        }

        .fade-item {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .fade-item.visible {
            opacity: 1;
        }




        /* Modal for Resumes/Projects/Essays */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: #000;
        }

        .modal-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-item {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-item:hover {
            background: #e0e0e0;
            transform: translateX(10px);
        }

        .modal-item h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) translateY(0); }
            50% { opacity: 0.5; transform: translateX(-50%) translateY(5px); }
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
            text-align: center;
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div id="intro-text">Jason Lee - Welcome to my website :)</div>
    </div>

    <div id="loading" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Loading your interactive portfolio...</p>
    </div>




    <!-- Modal for content -->
    <div id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="click-indicator">
        <span class="click-arrow">👆</span>
    </div>

    <div id="info-overlay">
        <div id="info-netflix" class="info-item fade-item">
            <strong>Technical Program Manager</strong><br>Netflix
        </div>
        <div id="info-amazon" class="info-item fade-item">
            <strong>Robotics Engineer</strong><br>Amazon
        </div>
        <div id="info-dartmouth" class="info-item fade-item">
            <strong>Dartmouth College</strong><br>Engineering Management<br><em>(Student Council President)</em>
        </div>
        <div id="info-mines" class="info-item fade-item">
            <strong>Colorado School of Mines</strong><br>Computer Science
        </div>
    </div>

    <div id="buttons-overlay">
        <a id="btn-projects" href="https://jasonleeprojectpage.surge.sh/" target="_blank" class="link-button fade-item">View Projects</a>
        <a id="btn-linkedin" href="https://www.linkedin.com/in/jason-lee-660690188/" target="_blank" class="link-button fade-item">LinkedIn Profile</a>
        <a id="btn-documentary" href="https://www.youtube.com/watch?v=E4CKj5Ng6kM" target="_blank" class="link-button fade-item">Watch Documentary</a>
    </div>

    <!-- Frank Ocean Music -->
    <audio id="background-music" autoplay loop>
        <source src="/Frank Ocean - Pink  White(instrumental).mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="/main.js"></script>
    <script>
        // Start music and journey immediately
        window.addEventListener('load', () => {
            const introScreen = document.getElementById('intro-screen');
            const audio = document.getElementById('background-music');
            audio.volume = 0.5;

            // Start music immediately
            audio.play().catch(e => {
                console.log('Autoplay blocked - will play on first interaction');
                document.addEventListener('click', () => audio.play(), { once: true });
            });

            // Show intro for 2 seconds, then fade out
            setTimeout(() => {
                introScreen.classList.add('fade-out');

                // Start journey after fade
                setTimeout(() => {
                    introScreen.remove();
                    window.dispatchEvent(new CustomEvent('journeyStart'));

                    // Show click indicator for 1.5 seconds then auto-hide
                    setTimeout(() => {
                        const clickIndicator = document.getElementById('click-indicator');
                        clickIndicator.classList.add('show');

                        // Auto-hide after 1.5 seconds
                        setTimeout(() => {
                            clickIndicator.classList.remove('show');
                        }, 1500);
                    }, 500);
                }, 500);
            }, 2000);
        });

        // Hide click indicator immediately on click
        document.addEventListener('click', () => {
            document.getElementById('click-indicator').classList.remove('show');
        }, { once: true });

        // Modal functions
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function showResumes() {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2>My Resumes</h2>
                <div class="modal-items">
                    <div class="modal-item">
                        <h3>Software Engineer Resume</h3>
                        <p>Full-stack development experience with modern web technologies...</p>
                    </div>
                    <div class="modal-item">
                        <h3>Creative Resume</h3>
                        <p>Design and creative projects showcasing artistic abilities...</p>
                    </div>
                    <div class="modal-item">
                        <h3>Academic Resume</h3>
                        <p>Educational background and research experience...</p>
                    </div>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function showProjects() {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2>My Projects</h2>
                <div class="modal-items">
                    <div class="modal-item">
                        <h3>Project Alpha</h3>
                        <p>An innovative web application using Three.js and modern frameworks...</p>
                    </div>
                    <div class="modal-item">
                        <h3>Project Beta</h3>
                        <p>Mobile-first responsive design with cutting-edge features...</p>
                    </div>
                    <div class="modal-item">
                        <h3>Project Gamma</h3>
                        <p>Full-stack application with real-time data processing...</p>
                    </div>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

    </script>
</body>
</html>
